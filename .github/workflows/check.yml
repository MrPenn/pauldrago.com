# Types, tests, the style lint and a full build, on every pull request and every push to main.
name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Page dates in the structured data and the sitemap come from git history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          # Node runs the build code's .ts files directly by stripping their types. Same major as local.
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run lint:style
      - run: npm run build
